name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
  # No paths-ignore on pull_request: `sdk-sync` is a required status check, and a
  # required check that is skipped by a path filter leaves docs-only PRs stuck
  # forever at "Expected — waiting for status".
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for MinVer to calculate version from git history

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit)
        run: >
          dotnet test tests/Samsara.Sdk.Tests/Samsara.Sdk.Tests.csproj
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.dotnet }}
          path: ./coverage/**/*.trx

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: false

  sdk-sync:
    # Job name is kept short and ASCII because it is the required status-check
    # name on `main`; renaming it later would silently un-require the check.
    name: sdk-sync
    runs-on: ubuntu-latest
    env:
      # CI is hermetic: it checks the SDK against the spec the SDK has actually
      # been reconciled against. Fetching the live spec here would let an
      # upstream edit turn an unrelated PR red — and it previously MASKED a stale
      # baseline, because live-vs-SDK passed while baseline-vs-SDK did not.
      # Live-spec drift is the daily api-sync-check workflow's job.
      SPEC: .github/cache/samsara-api-baseline.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify every SDK endpoint exists in the spec, and every spec op is implemented
        run: python3 tools/check-sdk-sync.py --spec-file "$SPEC" --fail-on-mismatch --fail-on-unimplemented

      - name: Verify no fabricated / mis-homed SDK methods
        run: python3 tools/check-sdk-fabrication.py --spec-file "$SPEC" --fail-on-issues

      - name: Verify SDK model shapes match the spec (MEDIUM gate)
        # MEDIUM since the v0.5.0 sweep: weak-typing, flattened records, type and
        # required-ness drift all gate here. The three remaining LOW findings
        # (FunctionRunContext.requestPayload/responsePayload, ReportRunData.rows) are
        # genuinely free-form in the spec and stay visible rather than allowlisted.
        run: python3 tools/check-model-sync.py --spec-file "$SPEC" --fail-on-severity MEDIUM

      - name: Verify the api-sync status block is current
        run: python3 tools/render-sync-status.py --check

  pack-check:
    name: NuGet Pack (dry-run)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Samsara.Sdk/Samsara.Sdk.csproj
          --no-build
          --configuration Release
          --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7
